<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta charset="UTF-8">
  <title>{site_name_better}</title>
  <link rel="stylesheet" href="./docsify-libs/vue.css">
  <link rel="stylesheet" href="./docsify-libs/mermaid.min.css">
  <script src="./docsify-libs/mermaid.min.js"></script>
  <style>
    .app-name-link img {
      width: 200px
    }
  </style>
</head>

<body>
  <div id="app">Please Wait...</div>

  <script>
    var num = 0;
    mermaid.initialize({
      startOnLoad: false
    });

    window.$docsify = {
      name: '{site_name}',
      //{site_logo}
      autoHeader: false,
      maxLevel: 4,
      subMaxLevel: 4,
      coverPage: false,
      auto2top: true,
      loadNavbar: {load_nav_bar},
      loadSidebar: {load_side_bar},
      relativePath: true,
      homepage: 'README.md',
      themeColor: 'rgb(5, 109, 174)',
      formatUpdated: function (time) {
        return time;
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === "mermaid") {
              return (
                '<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + "</div>"
              );
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      search: {
        placeholder: {
          '/': 'Type to search'
        },
        noData: {
          '/': 'No Results'
        },
        depth: 6,
        namespace: '{site_name_safe}',
      },
      plugins: [
        function (hook, vm) {
          hook.beforeEach(function (html) {
            //{edit_doc_func}
          });
        }
      ]
    }
  </script>
  <script>
    (function loadDocsifyAssets() {
      var remoteAssets = [
        'https://cdn.jsdelivr.net/npm/docsify@latest/lib/docsify.min.js',
        'https://cdn.jsdelivr.net/npm/docsify@latest/lib/plugins/search.min.js',
        'https://cdn.jsdelivr.net/npm/docsify-pagination@latest/dist/docsify-pagination.min.js',
        'https://cdn.jsdelivr.net/npm/docsify-copy-code@latest/dist/docsify-copy-code.min.js',
      ];

      var localAssets = [
        './docsify-libs/docsify.min.js',
        './docsify-libs/search.min.js',
        './docsify-libs/docsify-pagination.min.js',
        './docsify-libs/docsify-copy-code.min.js',
      ];

      var loadScripts = function (assets) {
        assets.forEach(function (url) {
          var script = document.createElement('script');
          script.src = url;
          script.defer = true;
          document.body.appendChild(script);
        });
      };

      var isOfflineMode = window.location.protocol === 'file:';
      loadScripts(isOfflineMode ? localAssets : remoteAssets);
    })();
  </script>
</body>

</html>
